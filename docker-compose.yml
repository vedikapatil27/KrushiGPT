version: '3.8'

services:
  krushigpt:
    build: .
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - BABEL_DEFAULT_LOCALE=${BABEL_DEFAULT_LOCALE:-en}
      - BABEL_SUPPORTED_LOCALES=${BABEL_SUPPORTED_LOCALES:-en,hi,mr,ta,te,gu,kn,bn,ml,pa,ur,or,as}
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./audio:/app/audio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
